<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.32s" begin="1.10s" fill="freeze"/><text x="40" y="297" fill="#34d399" font-family="monospace" font-size="12">STACK  </text><text x="132" y="297" fill="#d9e4f4" font-family="monospace" font-size="12">React · TypeScript · Vite · SQL</text></g>
