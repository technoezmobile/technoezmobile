<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Shivam's profile</title>
  <desc id="desc">A dark blue and emerald abstract banner with an S monogram and a softly moving orbit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.58" stop-color="#111b2d"/>
      <stop offset="1" stop-color="#092b2a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#10b981" stop-opacity=".24"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <style>@media(prefers-reduced-motion:reduce){#orbitMotion,#caretPulse{display:none}}</style>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity=".19"/>
    </pattern>
  </defs>
  <rect width="1200" height="310" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="310" rx="24" fill="url(#dots)"/>
  <ellipse cx="965" cy="155" rx="260" ry="210" fill="url(#glow)"/>
  <path d="M0 246 C220 204 286 288 505 240 S830 197 1200 253" fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".65"/>
  <g transform="translate(930 151)">
    <circle r="98" fill="none" stroke="#5eead4" stroke-opacity=".2"/>
    <ellipse rx="98" ry="36" fill="none" stroke="#5eead4" stroke-opacity=".46" transform="rotate(-34)"/>
    <circle r="67" fill="#0b1723" stroke="#34d399" stroke-opacity=".45"/>
    <text x="0" y="23" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="76" font-weight="700" fill="#d1fae5">S</text>
    <circle r="5" fill="#6ee7b7">
      <animateMotion id="orbitMotion" dur="18s" repeatCount="indefinite" path="M-95,-52 A108,42 -34 1,1 95,52 A108,42 -34 1,1 -95,-52"/>
    </circle>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" fill="#e2e8f0">
    <text x="76" y="94" font-size="16" letter-spacing="3" fill="#6ee7b7">BUILDING ON THE WEB</text>
    <text x="72" y="165" font-size="54" font-weight="700">Thoughtful interfaces.</text>
    <text x="75" y="207" font-size="22" fill="#aab8c9">Useful tools. Small details that make a difference.</text>
    <text x="78" y="265" font-family="Consolas,monospace" font-size="15" fill="#6ee7b7">&gt; ship ideas with care<span fill="#6ee7b7">
      <animate id="caretPulse" attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
    </span>▌</text>
  </g>
</svg>


